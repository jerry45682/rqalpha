stock_pool:
  index: 000300.XSHG
  symbols:

rebalance:
  frequency: weekly
  tradingday: 1

portfolio:
  holding_count: 10
  buffer_count: 20
  weighting: score

factors:
  enabled_categories:
    - valuation
    - quality
    - growth
    - momentum
    - reversal
    - risk
    - liquidity
    - technical
  category_weights:
    valuation: 0.03
    quality: 0.05
    growth: 0.07
    momentum: 0.35
    reversal: 0.10
    risk: 0.07
    liquidity: 0.08
    technical: 0.25
  factor_weights:
    valuation:
      pe_ttm: 0.15
      pb: 0.15
      ps_ttm: 0.25
      pcf_ncf_ttm: 0.45
    quality:
      roe: 0.25
      roa: 0.20
      gross_margin: 0.15
      debt_to_asset: 0.15
      asset_turnover: 0.15
      inventory_turnover: 0.05
      receivables_turnover: 0.05
    growth:
      revenue_growth_yoy: 0.40
      net_profit_growth_yoy: 0.40
      operating_cashflow_growth_yoy: 0.20
    momentum:
      return_20: 0.35
      return_60: 0.30
      return_120: 0.15
      price_ma60_strength: 0.20
    reversal:
      return_5: 0.70
      rsi: 0.30
    risk:
      volatility_60: 0.60
      max_drawdown_120: 0.40
    liquidity:
      avg_amount_20: 0.70
      avg_turnover_20: 0.30
    technical:
      macd_hist: 0.55
      obv_trend: 0.45

scoring:
  missing: median
  min_factor_coverage: 0.3
  winsorize_quantiles:
    - 0.01
    - 0.99
  standardize: zscore
  neutralize: none

filters:
  exclude_st: true
  exclude_suspended: true
  min_listed_days: 90
  min_avg_amount_20: 10000000
  require_positive_pe_pb: false
  skip_limit_up_buy: true
  skip_limit_down_sell: true

risk:
  max_stock_weight: 0.40
  max_industry_weight: 0.60
  market_timing:
    enabled: true
    index: 000300.XSHG
    ma120_exposure: 0.80
    ma250_exposure: 0.60
    full_exposure: 1.00

data:
  cache_dir: .rqalpha_factor_cache
  adjustflag: "2"
  start_date: "2023-01-01"
  end_date:
  prefetch: true
  prefetch_workers: 4
  runtime_fetch: true
  runtime_fetch_financial: false
  runtime_fetch_industry: true
  financial_tables:
    - profit
    - balance
    - growth
    - cash_flow
    - dupont
    - operation

backtest:
  start_date: "2024-01-03"
  end_date: "2024-8-26"
  frequency: 1d
  benchmark: 000300.XSHG
  initial_cash: 1000000
  data_bundle_path:
  result_path: rqalpha_factor_framework/backtest/multi_factor_result_aggressive_weekly.pkl
